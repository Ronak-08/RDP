name: Linux RDP

on: [push, workflow_dispatch]

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 9999

    steps:
    - name: Install Desktop Environment
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xfce4 \
          xfce4-goodies \
          xrdp \
          firefox \
          filezilla
        
        # Configure xRDP to use XFCE
        echo xfce4-session > ~/.xsession
        sudo systemctl enable xrdp
        sudo systemctl start xrdp
        
        # Set password for current user (ubuntu)
        echo "ubuntu:Pass123456" | sudo chpasswd

    - name: Install Ngrok
      run: |
        wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar xzf ngrok-v3-stable-linux-amd64.tgz
        chmod +x ngrok

    - name: Setup Ngrok Auth
      run: |
        ./ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start Ngrok Tunnel
      run: |
        ./ngrok tcp 3389 --log=stdout > ngrok.log &
        sleep 10
        echo "Ngrok tunnel established:"
        curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'

    - name: Keep Alive
      run: |
        # Keep the runner alive for maximum time
        echo "RDP session active. Use the ngrok URL above to connect."
        echo "Username: ubuntu"
        echo "Password: Pass123456"
        echo "Session will timeout after 360 minutes or when cancelled."
        sleep 21600  # 6 hours max
