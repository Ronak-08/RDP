name: Linux RDP

on: [push, workflow_dispatch]

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Set to the maximum of 6 hours

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Install Desktop Environment, xRDP, and other tools
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xfce4 \
          xfce4-goodies \
          xrdp \
          firefox \
          filezilla
        
    - name: Configure xRDP
      run: |
        # Set the session for the runner user
        echo "xfce4-session" > /home/runner/.xsession
        
        # Configure xrdp to use the correct display
        sudo sed -i 's/port=3389/port=tcp:\/\/:3389/g' /etc/xrdp/xrdp.ini
        
        # Set a password for the runner user
        echo "runner:your-strong-password" | sudo chpasswd
        
    - name: Start xRDP Service
      run: |
        # Start the xrdp service directly
        sudo /etc/init.d/xrdp start
        
    - name: Install and Start Ngrok
      run: |
        wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar xzf ngrok-v3-stable-linux-amd64.tgz
        chmod +x ngrok
        ./ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
        # Start ngrok in the background
        nohup ./ngrok tcp 3389 &
        
        # Give ngrok some time to start
        sleep 10
        
        # Get the public URL from the ngrok API
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r ".tunnels[0].public_url")
        echo "RDP Address: ${NGROK_URL}"
        echo "Username: runner"
        echo "Password: your-strong-password"
        
    - name: Keep the Job Alive
      run: |
        # This will keep the runner alive for approximately 6 hours.
        sleep 21000
